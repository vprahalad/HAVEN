services:
  # PostgreSQL Database
  - type: pspg
    name: haven-database
    plan: free
    databaseName: haven
    user: haven_user

  # Flask Backend API
  - type: web
    name: haven-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && mkdir -p uploads && python init_db.py
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: haven-database
          property: connectionString
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: haven-frontend
          property: host
      - key: ROBOFLOW_API_KEY
        sync: false
      - key: ROBOFLOW_MODEL_ID
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false

  # Next.js Frontend
  - type: web
    name: haven-frontend
    env: node
    plan: free
    buildCommand: cd haven-frontend && npm install && npm run build
    startCommand: cd haven-frontend && npm start
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: NEXT_PUBLIC_API_BASE_URL
        value: /api
      - key: NEXT_PUBLIC_BACKEND_URL
        fromService:
          type: web
          name: haven-backend
          property: host
      - key: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
        sync: false

